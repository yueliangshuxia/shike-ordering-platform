<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 食刻</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.06fr);
    min-height: calc(100vh - var(--head-h));
  }
  .auth-side {
    background: var(--pine);
    color: var(--rice);
    padding: 54px 52px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .auth-side h1 { font-size: var(--fs-3xl); line-height: 1.28; margin-bottom: 14px; }
  .auth-side p { color: rgba(247, 246, 242, .72); max-width: 40ch; }
  .auth-facts { margin-top: auto; padding-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .auth-fact { display: flex; gap: 12px; align-items: flex-start; font-size: var(--fs-sm); }
  .auth-fact .af-icon {
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: var(--r-sm);
    color: #E8A99E;
  }
  .auth-fact b { display: block; color: var(--rice); font-weight: 600; margin-bottom: 2px; }
  .auth-fact span { color: rgba(247, 246, 242, .6); }
  .auth-side .tile {
    position: absolute; right: -60px; bottom: -50px;
    width: 300px; opacity: .1; pointer-events: none;
  }

  .auth-main { display: grid; place-items: center; padding: 46px 30px; background: var(--paper); }
  .auth-card { width: min(400px, 100%); }
  .auth-card h2 { font-size: var(--fs-2xl); margin-bottom: 6px; }
  .auth-card > p { color: var(--ink-3); margin-bottom: 26px; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab {
    padding: 11px 3px; margin-right: 26px;
    border: 0; background: none; cursor: pointer;
    font-size: var(--fs-md); font-family: var(--font-song); font-weight: 700;
    color: var(--ink-3);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }
  .tab.is-on { color: var(--ink); border-bottom-color: var(--cinnabar); }

  .code-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--ink-3); font-size: var(--fs-sm);
    margin: 22px 0 16px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  @media (max-width: 900px) {
    .auth-wrap { grid-template-columns: 1fr; }
    .auth-side { display: none; }
  }
</style>
</head>
<body class="page">

<header data-topbar></header>

<main id="main">
  <div class="auth-wrap">

    <div class="auth-side">
      <div>
        <h1>坐下来之前<br>先把菜点上</h1>
        <p>
          登录之后能存口味偏好、看历史订单，
          推荐也会跟着你的实际点单慢慢变准。
        </p>
      </div>

      <div class="auth-facts">
        <div class="auth-fact">
          <span class="af-icon"><iconify-icon icon="mdi:star" width="17" height="17"></iconify-icon></span>
          <span><b>推荐按你的口味算</b><span>AHP 定权重，TOPSIS 排序，每道菜的分数都能查</span></span>
        </div>
        <div class="auth-fact">
          <span class="af-icon"><iconify-icon icon="mdi:clock-outline" width="17" height="17"></iconify-icon></span>
          <span><b>出餐时间标在菜上</b><span>赶时间就挑 10 分钟以内的，不用猜</span></span>
        </div>
        <div class="auth-fact">
          <span class="af-icon"><iconify-icon icon="mdi:receipt-text-outline" width="17" height="17"></iconify-icon></span>
          <span><b>历史订单能一键再来一单</b><span>常点的组合不用重新挑一遍</span></span>
        </div>
      </div>

      <img class="tile" src="assets/illustrations/getting_coffee_wntr.svg" alt="">
    </div>

    <div class="auth-main">
      <div class="auth-card">
        <h2 id="auth-title">欢迎回来</h2>
        <p id="auth-sub">用手机号登录，没注册过会自动创建账号</p>

        <div class="tabs" role="tablist">
          <button class="tab is-on" type="button" role="tab" data-tab="login">登录</button>
          <button class="tab" type="button" role="tab" data-tab="reg">注册</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="phone">手机号</label>
            <input id="phone" type="tel" inputmode="numeric" placeholder="11 位手机号" maxlength="11" autocomplete="tel">
            <div class="hint" id="phone-hint"></div>
          </div>

          <div class="field" id="name-field" hidden>
            <label for="uname">称呼</label>
            <input id="uname" type="text" placeholder="怎么称呼你" autocomplete="nickname">
          </div>

          <div class="field">
            <label for="code">验证码</label>
            <div class="code-row">
              <input id="code" type="text" inputmode="numeric" placeholder="6 位数字" maxlength="6" autocomplete="one-time-code">
              <button class="btn btn-ghost" type="button" id="send-code" style="white-space:nowrap">获取验证码</button>
            </div>
            <div class="hint">演示环境不发短信，验证码固定填 <b>123456</b></div>
          </div>

          <label class="inline" style="font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:18px">
            <input type="checkbox" id="agree" checked>
            我已阅读并同意《用户协议》和《隐私政策》
          </label>

          <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">登录</button>
        </form>

        <div class="divider">或者</div>

        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" type="button" style="flex:1" data-oauth="微信">
            <iconify-icon icon="mdi:wechat" width="18" height="18"></iconify-icon>微信
          </button>
          <button class="btn btn-ghost" type="button" style="flex:1" data-oauth="支付宝">
            <iconify-icon icon="mdi:cash" width="18" height="18"></iconify-icon>支付宝
          </button>
        </div>

        <p style="text-align:center;margin-top:24px;font-size:var(--fs-sm)">
          <a href="menu.html" style="color:var(--ink-3)">先不登录，直接点菜 →</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script src="assets/vendor/iconify-icon.min.js"></script>
<script src="assets/icons/bundle.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let mode = 'login';

  const titleEl = document.getElementById('auth-title');
  const subEl = document.getElementById('auth-sub');
  const nameField = document.getElementById('name-field');
  const submitBtn = document.getElementById('submit-btn');
  const phoneHint = document.getElementById('phone-hint');

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    mode = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('is-on', x === t));
    const isReg = mode === 'reg';
    titleEl.textContent = isReg ? '第一次来？' : '欢迎回来';
    subEl.textContent = isReg ? '注册只要手机号和一个称呼' : '用手机号登录，没注册过会自动创建账号';
    nameField.hidden = !isReg;
    submitBtn.textContent = isReg ? '注册并登录' : '登录';
  }));

  const phone = document.getElementById('phone');
  phone.addEventListener('input', () => {
    phone.value = phone.value.replace(/\D/g, '');
    phoneHint.textContent = phone.value && phone.value.length !== 11
      ? '手机号得是 11 位' : '';
    phoneHint.style.color = 'var(--cinnabar)';
  });

  // 倒计时期间按钮禁用，防止连点
  document.getElementById('send-code').addEventListener('click', (e) => {
    if (phone.value.length !== 11) {
      phoneHint.textContent = '先填对手机号再获取验证码';
      phoneHint.style.color = 'var(--cinnabar)';
      phone.focus();
      return;
    }
    const btn = e.currentTarget;
    let left = 60;
    btn.disabled = true;
    btn.textContent = `${left} 秒后重发`;
    SK.toast('验证码已发送（演示环境固定 123456）', 'mdi:message-text-outline');
    const timer = setInterval(() => {
      left -= 1;
      btn.textContent = left > 0 ? `${left} 秒后重发` : '获取验证码';
      if (left <= 0) { clearInterval(timer); btn.disabled = false; }
    }, 1000);
  });

  document.getElementById('auth-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (phone.value.length !== 11) {
      phoneHint.textContent = '手机号得是 11 位';
      phoneHint.style.color = 'var(--cinnabar)';
      phone.focus();
      return;
    }
    if (document.getElementById('code').value !== '123456') {
      SK.toast('验证码不对，演示环境固定填 123456', 'mdi:alert-circle-outline');
      return;
    }
    if (!document.getElementById('agree').checked) {
      SK.toast('需要先同意用户协议', 'mdi:alert-circle-outline');
      return;
    }

    // 静态 Demo：只把登录态记在本地
    const name = document.getElementById('uname').value.trim() || '陈同学';
    localStorage.setItem('sk_user_v1', JSON.stringify({ phone: phone.value, name }));
    USER_PROFILE.user.name = name;

    SK.toast(`${mode === 'reg' ? '注册成功，' : ''}欢迎回来，${name}`, 'mdi:check-circle');
    setTimeout(() => { location.href = 'profile.html'; }, 800);
  });

  document.querySelectorAll('[data-oauth]').forEach(b => b.addEventListener('click', () => {
    SK.toast(`${b.dataset.oauth}登录是演示占位，请用手机号验证码`, 'mdi:information-outline');
  }));
});
</script>
</body>
</html>
